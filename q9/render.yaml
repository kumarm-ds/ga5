services:
  - type: web
    name: mailroom-agent
    env: node
    plan: free
    region: oregon
    rootDir: q9
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL_NAME
        value: gemini-2.5-flash
      - key: MODEL_CONCURRENCY
        value: "8"
      - key: DB_PATH
        value: ./data.db