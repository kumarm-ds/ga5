services:
  - type: web
    name: incident-agent
    env: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      - key: DB_PATH
        value: /var/data/incident-agent.db
    disk:
      name: incident-agent-data
      mountPath: /var/data
      sizeGB: 1
